spring.application.name=yummy
# Database configurations
spring.datasource.url=jdbc:mysql://localhost:3306/yummy
spring.datasource.username=root
spring.datasource.password=


# jpa hibernate configurations
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format-sql=true
spring.jpa.hibernate.ddl-auto=update


#set the media upload size limit configurations
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
restaurant.file.path=uploads/restaurants-banners/

#we have to use database it is temporary
spring.security.user.name=user
spring.security.user.password=user